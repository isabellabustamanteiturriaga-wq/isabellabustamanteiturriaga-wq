<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-label="Isabella Bustamante - Data Scientist, Research Analyst, Public Affairs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="0.6" stop-color="#0F1A33"/>
      <stop offset="1" stop-color="#14224A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>
  <rect width="1600" height="480" fill="url(#glow)"/>

  <!-- Network graph (right) -->
  <g stroke="url(#accent)" stroke-opacity="0.55" stroke-width="1.5" fill="none">
    <line x1="1000" y1="140" x2="1130" y2="210"/>
    <line x1="1130" y1="210" x2="1260" y2="120"/>
    <line x1="1260" y1="120" x2="1400" y2="190"/>
    <line x1="1130" y1="210" x2="1230" y2="320"/>
    <line x1="1400" y1="190" x2="1500" y2="290"/>
    <line x1="1230" y1="320" x2="1400" y2="190"/>
    <line x1="1000" y1="140" x2="1090" y2="70"/>
    <line x1="1090" y1="70" x2="1260" y2="120"/>
    <line x1="1130" y1="210" x2="1020" y2="330"/>
    <line x1="1020" y1="330" x2="1230" y2="320"/>
    <line x1="1400" y1="190" x2="1510" y2="100"/>
  </g>
  <g fill="#0A1020" stroke="url(#accent)" stroke-width="2.5">
    <circle cx="1000" cy="140" r="8"/>
    <circle cx="1130" cy="210" r="12"/>
    <circle cx="1260" cy="120" r="9"/>
    <circle cx="1400" cy="190" r="13"/>
    <circle cx="1230" cy="320" r="10"/>
    <circle cx="1500" cy="290" r="8"/>
    <circle cx="1090" cy="70" r="6"/>
    <circle cx="1020" cy="330" r="7"/>
    <circle cx="1510" cy="100" r="6"/>
  </g>
  <g fill="#38BDF8">
    <circle cx="1130" cy="210" r="4"/>
    <circle cx="1400" cy="190" r="4.5"/>
    <circle cx="1230" cy="320" r="3.5"/>
  </g>

  <!-- Mini chart (bars + trend line) -->
  <g transform="translate(1290 330)" opacity="0.9">
    <rect x="0" y="40" width="14" height="30" rx="2" fill="#6366F1" fill-opacity="0.7"/>
    <rect x="22" y="28" width="14" height="42" rx="2" fill="#6366F1" fill-opacity="0.7"/>
    <rect x="44" y="34" width="14" height="36" rx="2" fill="#6366F1" fill-opacity="0.7"/>
    <rect x="66" y="14" width="14" height="56" rx="2" fill="#38BDF8" fill-opacity="0.8"/>
    <rect x="88" y="4" width="14" height="66" rx="2" fill="#38BDF8" fill-opacity="0.8"/>
    <polyline points="7,34 29,22 51,28 73,8 95,-2" fill="none" stroke="#E2E8F0" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Code-style tag (top left) -->
  <text x="90" y="92" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="18" fill="#38BDF8" letter-spacing="2">&lt;/&gt; DATA  ·  RESEARCH  ·  PUBLIC POLICY</text>

  <!-- Name -->
  <text x="90" y="190" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="76" font-weight="700" fill="#F8FAFC" letter-spacing="-1">Isabella Bustamante</text>
  <rect x="92" y="212" width="120" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- Roles -->
  <text x="90" y="272" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="500" fill="#CBD5E1">Data Scientist  <tspan fill="#38BDF8">|</tspan>  Research Analyst  <tspan fill="#38BDF8">|</tspan>  Public Affairs</text>

  <text x="90" y="318" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#94A3B8">Data Analytics • Artificial Intelligence • Applied Research</text>

  <!-- Contact chips -->
  <g font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#E2E8F0">
    <rect x="90" y="370" width="470" height="46" rx="23" fill="#111B33" stroke="#6366F1" stroke-opacity="0.7" stroke-width="1.5"/>
    <circle cx="118" cy="393" r="5" fill="#6366F1"/>
    <text x="136" y="399">isabellabustamanteiturriaga@gmail.com</text>

    <rect x="580" y="370" width="300" height="46" rx="23" fill="#111B33" stroke="#38BDF8" stroke-opacity="0.7" stroke-width="1.5"/>
    <circle cx="608" cy="393" r="5" fill="#38BDF8"/>
    <text x="626" y="399">Upwork · Freelance profile</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="474" width="1600" height="6" fill="url(#accent)"/>
</svg>
